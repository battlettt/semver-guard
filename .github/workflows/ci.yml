name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Smoke-test the CLI against the fixtures
        run: |
          set +e
          node dist/cli.js compare --from fixtures/after --to fixtures/after
          test $? -eq 0 || exit 1
          node dist/cli.js compare --from fixtures/before --to fixtures/after --format json > report.json
          test $? -eq 1 || exit 1
          node -e "const r = require('./report.json'); if (r.summary.breaking !== 6) process.exit(1)"
          node dist/cli.js compare --from fixtures/components-before --to fixtures/components-after --format json > components.json
          test $? -eq 1 || exit 1
          node -e "const r = require('./components.json'); if (r.summary.breaking !== 2) process.exit(1)"
      - name: Smoke-test the CLI in git ref mode
        run: |
          set +e
          cli="$GITHUB_WORKSPACE/dist/cli.js"
          repo="$(mktemp -d)"
          cd "$repo"
          git init -q
          git config user.name "semver-guard CI"
          git config user.email "ci@example.invalid"
          mkdir src
          printf '%s\n' \
            'export function greet(name: string): string { return `hi ${name}`; }' \
            'export function parse(input: string): number { return Number(input); }' > src/index.ts
          git add . && git commit -q -m "v1"
          git tag v1
          # Widening a parameter is safe; removing an export is breaking.
          printf '%s\n' \
            'export function greet(name: string | number): string { return `hi ${name}`; }' > src/index.ts
          git commit -q -am "v2"
          node "$cli" compare --from-ref v1 --to-ref v1
          test $? -eq 0 || exit 1
          node "$cli" compare --from-ref v1 --to-ref HEAD
          test $? -eq 1 || exit 1
          node "$cli" compare --from-ref v1 --to-ref HEAD --format json > report.json
          test $? -eq 1 || exit 1
          node -e "
            const r = require('./report.json');
            const ok = r.summary.breaking === 1 && r.changes[0].code === 'export-removed' && r.changes[0].export === 'parse';
            if (!ok) { console.error(JSON.stringify(r, null, 2)); process.exit(1); }
          "
